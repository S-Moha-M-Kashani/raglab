[project]
name = "raglab"
version = "1.0.0"
description = "RAG lab — a retrieval workbench where choices are decided by measurement"
readme = "README.md"
authors = [{ name = "Moha Kashani", email = "s.moha.m.kashani@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["rag", "retrieval", "evaluation", "ragas", "langgraph"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "httpx>=0.27",
  # langchain 1.x, taken 2026-08-18. The old `<1` pins were attributed to ragas
  # and were not ragas's: no ragas 0.4.x declares an upper bound on any
  # langchain package (checked 0.4.0 through 0.4.3 on PyPI). What ragas 0.4.3
  # really requires is one *module* — `ragas/llms/base.py` imports
  # `langchain_community.chat_models.vertexai` at import time, and
  # langchain-community 0.4 deleted it. So the constraint is a floor on
  # langchain-core and a ceiling on langchain-community, and they do not
  # conflict: community 0.3.31 declares `langchain-core<2`, which is what lets
  # a 0.3-line community sit under a 1.x core.
  # `langchain` itself, not only -core: `init_chat_model` lives in
  # langchain.chat_models. It arrives transitively via langchain-community, and
  # an import that works by accident is one dependency resolution away from not.
  "langchain>=1,<2",
  "langchain-core>=1.6.1,<2",
  "langchain-openai>=1,<2",
  # NOT `<0.4` for the reason the old comment gave (a 1.x brain in a shared
  # environment) but for ragas's vertexai import above. It is the one pin here
  # that holds a package back, and it is upstream's to lift: ragas's own main
  # branch still carries that import (checked 2026-08-18), so a newer ragas is
  # not waiting to be taken — 0.4.3 is the newest that exists.
  "langchain-community>=0.3.31,<0.4",
  "ragas==0.4.*",
  # RAGAS's offline string-similarity context metrics need it.
  "rapidfuzz",
  # The two grouping families behind `IndexConfig.hierarchy`: networkx partitions
  # the chunk graph (Louvain, label propagation) and scikit-learn clusters the
  # chunk vectors (GMM, Ward, k-means) and scores both partitions. Both are
  # already in the tree via sentence-transformers, and both are declared anyway
  # for the reason `langchain` is declared beside `langchain-core`: an import
  # that works by accident is one dependency resolution away from not.
  "networkx>=3.0",
  "scikit-learn>=1.4",
  # The widget's prompts are YAML pages under fixtures/prompts/, read at
  # import on the server's startup path. Already in the tree via
  # langchain-core, and declared for the reason langchain is declared beside
  # langchain-core: an import that works by accident is one dependency
  # resolution away from not.
  "pyyaml>=6.0",
  # The widget's tool loop and its conversation memory name langgraph directly
  # (`create_agent`'s prebuilt loop, the `SqliteSaver` checkpointer every agent
  # shares — see `langgraph-checkpoint-sqlite` below). It arrives transitively —
  # langchain 1.x requires `langgraph>=1.2.11` — and is declared for the same
  # reason langchain is declared beside langchain-core. Nothing from `langsmith`
  # is enabled here: the widget writes no number, which is the only reason it may
  # trace at all, and no measured stage may phone a tracing service to explain
  # itself when `.runs/` and the ledger are what account for a run.
  "langgraph>=1.2,<2",
  # The widget's conversation memory is durable: one SqliteSaver over
  # databases/widget.db, so a reader's chat survives a restart the way the
  # ledger does and the in-memory index does not. A separate distribution from
  # langgraph itself, and declared for the same reason langchain is declared
  # beside langchain-core — an import that works by accident is one dependency
  # resolution away from not. The floor is 3.1.1 rather than the 2.0 the import
  # alone would need, because New Chat is implemented on one method:
  # `SqliteSaver.delete_thread`, which conversation_memory.forget() calls to end
  # the conversation a reader is in without touching any other experiment's. A
  # resolve that landed a version without it would install fine, serve fine, and
  # then raise AttributeError the first time anyone pressed the button. 3.1.1 is
  # the version that method was verified present on here.
  "langgraph-checkpoint-sqlite>=3.1.1",
  # The two dataset schemas (schema_corpus.json, schema_groundtruth.json) are
  # the single source of structural truth (D9); this is what `validate()`
  # runs them with, instead of restating their rules in Python. Small and
  # pure — no compiled wheels, no transitive surprise.
  "jsonschema>=4.23",
  # Leiden's grouping pair. Compiled wheels, but prebuilt for the common
  # platforms — core so `hierarchy='leiden'` works on a plain `uv sync`
  # instead of hiding behind a graph-index extra nobody discovered.
  "leidenalg>=0.10",
  "python-igraph>=0.11",
]

[project.optional-dependencies]
# Two embedding backends, both optional, because the models are large and a lab
# that cannot start is worse than one reporting a model as unavailable.
semantic = ["fastembed>=0.7"]
# ~1 GB. Reaches the Persian-tuned encoders and Qwen3, which are plain
# HuggingFace checkpoints fastembed does not serve. The default embedder needs
# this — see README's launch line and tests/test_conventions.py.
local-embeddings = ["sentence-transformers>=3.0"]
# The browser suite. Playwright through Python rather than npm: it rides the
# pytest/uv toolchain this repo already has, so there is no second test runner,
# no lockfile and no node_modules. The Chromium binary is not a package — it is
# installed once, outside the repo, with `uv run playwright install chromium`.
browser-tests = ["pytest-playwright>=0.5"]

[project.urls]
Repository = "https://github.com/S-Moha-M-Kashani/raglab"

[project.scripts]
raglab = "raglab.dashboard.cli.serve:panel"
raglab-lab = "raglab.dashboard.cli.lab:main"
raglab-sweep = "raglab.agents.extra_tools.sweep:main"
raglab-judgescreen = "raglab.agents.extra_tools.judgescreen:main"
raglab-export = "raglab.agents.extra_tools.export:main"
raglab-leaderboard = "raglab.evaluation.leaderboard:main"

[dependency-groups]
# httpx2 is starlette's own client for `TestClient` since starlette 1.6: with
# only httpx installed its testclient module still works but warns once per
# run, and the whole offline suite goes through it. Test-only — the app's
# runtime dependency above stays `httpx`, which is what the lab itself calls
# out with.
dev = ["pytest>=8.0", "httpx2>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.pytest.ini_options]
# Tests are colocated with what they test (each section's tests/ folder);
# repo-wide guards live in src/raglab/tests/. There is no top-level tests/.
testpaths = ["src/raglab"]
# The browser suite is opt-in and deselected here, so `uv run pytest src/raglab`
# behaves identically whether or not the `browser-tests` extra is installed —
# which matters because CI installs every extra. A command-line `-m` overrides
# this one, so the suite is run with:
#   uv run pytest src/raglab -m browser
addopts = "-m 'not browser and not live'"
markers = [
  "browser: end-to-end journey driven through a real headless Chromium; opt-in, deselected by default (see README)",
  "live: spends real model calls; opt-in twice over — this marker is deselected here, and the test file must also be named on the command line (see README)",
]
