# The model-facing description of each widget tool — what the agent reads
# when deciding whether and how to call it. One key per tool name; the
# convention test holds this file and widget.TOOLS to the same set.
search_knowledge_base: |-
  Look up facts about the RAG lab project.

  Use this for any question about what the lab is, its ports, commands,
  architecture, metrics, storage or embedder.

  Args:
      query: A few keywords, e.g. "ports" or "decision metrics".
calculate: |-
  Evaluate an arithmetic expression, e.g. "68000000 / 551695".

  Args:
      expression: Numbers and the operators + - * / // % ** only.
search_rag_skills: |-
  Find RAG-technique skills — field knowledge about retrieval, chunking,
  reranking, evaluation, methodology — relevant to a question.

  Returns matching skill names with their descriptions. Matching is
  literal keyword search, not semantic — a synonym finds nothing — so if
  the hits look thin or off-topic, search again with different wording
  before settling. Judge candidates by their descriptions, then follow up
  with read_rag_skill for the full text of the ones that fit.

  Args:
      query: A few keywords, e.g. "reranking" or "judge screening".
read_rag_skill: |-
  Read the full text of one or more RAG skills, up to three per call.

  Args:
      names: Skill names from search_rag_skills, comma-separated,
          e.g. "rag-evaluation, reranking-late-interaction".
search_knobs: |-
  Find the knobs of this lab — the controls an experiment is configured
  with — by key or by what they do. Use it whenever a question is about a
  setting rather than about the field: what a knob does, whether changing
  it costs an index rebuild, why it is greyed out, or which knob to move
  for a symptom.

  Returns the closest knob keys with a one-line summary each — ranked, at
  most eight, and saying how many more matched less closely — or the whole
  knob surface when nothing matches. Matching is literal keyword search, not
  semantic. Read the closest hit with read_knob rather than searching again:
  a second search with different wording is worth one try at most, and the
  page you were pointed at answers more than another shortlist will.

  This is the lab's own controls; search_rag_skills is the field's
  techniques. A question naming a key like "retrieval.reranker" belongs
  here; "should I use a cross-encoder at all" belongs there.

  Args:
      query: A knob key or a few keywords, e.g. "retrieval.summary_scope"
          or "rebuild fingerprint".
read_knob: |-
  Read the full page for one or more knobs, at most three per call.

  Each page says what the knob does, what it means scientifically, why RAG
  architectures have such a knob, when it is useful, and which knobs it
  interacts with — and the reply ends with a "related knobs:" line naming
  those, so a follow-up needs no second search. Numbers a page quotes as
  measured are facts about the corpus named beside them, not about RAG in
  general: repeat the corpus when you repeat the number.

  Args:
      keys: Knob keys from search_knobs, comma-separated, e.g.
          "index.chunker, retrieval.k".
measure_bilingual_alignment: |-
  Measure, live on this machine, whether an embedding model aligns
  English with Farsi — i.e. whether one index could serve cross-language
  search. Use this when asked whether an embedder handles both languages:
  the answer is a measurement, never the model card's claim.

  Runs each English sentence and its Farsi translation through the
  encoder and reports translation-pair against mismatched-pair cosine,
  plus retrieval in a pool mixing both languages (the same-language-bias
  check).

  Args:
      model_name: A sentence-transformers checkpoint. Empty means the lab
          default, heydariAI/persian-embeddings. A checkpoint not already
          on this machine is downloaded first, possibly gigabytes — name
          one only when the user asked for that model.
      pairs: Optional probe data — a JSON list of at least two
          [english, farsi] pairs, each a non-empty string, e.g.
          [["I slept badly.", "بد خوابیدم."], ["It rained.", "باران آمد."]].
          Pass sentences the user provides in this shape. Empty means the
          bundled diary-like pairs (fixtures/bilingual_probe_pairs.json).
read_long_term_memory: |-
  Read accepted long-term memory for a dataset and the reusable patterns
  shared across datasets. This is a read-only summary, not experiment
  evidence or a measured result; do not present it as proof of a claim.

  Use this when prior widget conversations may contain a reusable finding.
  The memory is selected by the system's memory policy, so do not infer or
  save anything from this tool's availability alone.

  Args:
      dataset_id: The corpus id whose memory should be read, e.g. "diary-en"
          or "smoke-mini".
recall_conversation: |-
  Read what was said about one experiment in an earlier conversation, by its
  experiment id. Use it when the reader asks about an experiment that is not
  the one open now — "what did I conclude about abc123?", "did we discuss
  this corpus before?" — because each experiment keeps its own conversation
  and you are only holding the current one.

  This is memory, not evidence. It returns what was said, which may have been
  wrong: nothing here is a measurement, and a claim recalled from a
  conversation must never be reported as something the lab measured. For what
  an experiment actually produced, read_experiment is the record.

  At most 20 turns, the most recent, and the reply says when earlier ones were
  left out. An experiment nobody has discussed says so rather than coming back
  empty.
list_experiments: |-
  List the experiments this lab has already recorded, newest first: the id,
  the corpus, what ran, the decision score with its error, the judge and the
  backend that answered.

  Start here for any question about past runs — you need an id before you can
  read one. A row reading "unjudged" scored none of the four deciding metrics,
  so it makes no claim; a row whose backend is "fake" measured nothing at all
  and must never be compared as if it had.

  Args:
      dataset: A corpus id to restrict to, e.g. "diary-fa" or "smoke-mini".
          Leave empty for every corpus. Scores never cross corpora, so a
          question about one dataset should pass it.
read_experiment: |-
  Read one experiment: its knobs step by step, the four judged metrics that
  decide, the judge, the deterministic summary and the backend that answered.

  To compare two experiments, call this once per id. Then say plainly whether
  they are comparable before saying which is better: only rows on the same
  dataset, over the same question set, graded by the same judge can be
  compared at all, and a lead smaller than the two errors combined is a tie,
  not a win. One knob differing is a finding; three differing is not.

  Args:
      experiment_id: An id from list_experiments.
read_experiment_questions: |-
  Read the per-question rows of one evaluation — by default the questions
  whose gold evidence retrieval did not fully find inside k.

  Each row names the question, its type and difficulty, recall, precision,
  mrr, and which evidence sessions were expected against which were
  retrieved. This is the evidence for any answer about what to change: read
  it before recommending a knob, and pair it with the RAG skills
  (search_rag_skills) so the recommendation rests on both this run's failures
  and the field's technique.

  Args:
      experiment_id: An id from list_experiments.
      only: "missed" for questions whose evidence was not fully retrieved
          (the default), "abstained" for questions the answerer declined, or
          "all" for every row.
