<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Lab · Inspector</title>
  <!-- The stored theme, stamped before anything paints. All three surfaces are
       one origin now, so the choice made on any of them is the choice here. -->
  <script>try{var t=localStorage.getItem('raglab-theme');if(t==='day'||t==='night')document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- lab.js owns the switch itself and loads at the foot of the page, the
       way the panel's does. -->
  <!-- Design tokens shared with the panel on :9002; before inspector.css so
       its overrides still win. -->
  <link rel="stylesheet" href="/tokens.css">
  <!-- The bar and the surface switcher, shared with the panel on :9002; before
       inspector.css so its overrides still win. -->
  <link rel="stylesheet" href="/chrome.css">
  <link rel="stylesheet" href="/inspector/inspector.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the evidence</a>

  <!-- The same bar the panel wears, so neither surface is a dead end: the
       Inspector could always be reached from the lab but never led back. -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="http://localhost:9002/"><span class="lab-mark">RL</span>RAG Lab</a>
      <nav class="topnav" aria-label="Surfaces">
        <a href="http://localhost:9002/">Laboratory</a>
        <a href="/" aria-current="page">Inspector</a>
        <a href="http://localhost:9002/leaderboard">Leaderboard</a>
      </nav>
      <div class="topbar-actions">
        <button class="settings-button" id="app-settings" type="button"
          popovertarget="app-settings-panel" aria-label="Settings" title="Settings">⚙</button>
        <div class="settings-popover" id="app-settings-panel" popover
             aria-label="Settings">
          <div class="settings-head">
            <b>Settings</b>
            <span>This installation</span>
          </div>
          <div class="settings-group">
            <h3 id="theme-control-label">Theme</h3>
            <div class="theme-control" id="theme-control"
                 aria-labelledby="theme-control-label"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <header class="inspector-header">
    <!-- The band's ink is full-bleed and its content is not: the header is a
         page-level band like the bar above it, so it centres on the same
         measure. Without this wrapper its title and tabs sat 77px left of
         every card on the page at any viewport wider than the measure. -->
    <div class="inspector-header-inner">
      <!-- The mark moved to the shared bar above; what stays here is the view's
           own title and the lab-reachability line beneath it. -->
      <h1>Inspector</h1>
      <!-- The lab is another process and may not be running; say which, and stop
           the reader wondering whether an empty view means "nothing ran" or
           "nothing is listening". -->
      <div class="inspector-status-line">
        <span class="follow-state" id="follow-state">looking for the lab&hellip;</span>
        <span class="archive-state" id="archive-state" aria-live="polite" hidden></span>
        <button class="archive-return-live" id="archive-return-live" type="button" hidden>
          Return to live
        </button>
      </div>
      <!-- A real tablist, not four buttons carrying `aria-selected`: that
           attribute means nothing on an element without `role="tab"`, so a
           screen reader was told which view was showing by nothing at all.
           One stop in the page's tab order (roving tabindex), and the arrows
           walk between the four. -->
      <div class="inspector-tabs" role="tablist" aria-label="Views">
        <button class="inspector-tab" id="tab-groundtruth" role="tab"
                aria-controls="view-groundtruth" aria-selected="true"
                data-view="groundtruth">Ground truth</button>
        <button class="inspector-tab" id="tab-chunks" role="tab"
                aria-controls="view-chunks" aria-selected="false" tabindex="-1"
                data-view="chunks" data-step="index">Chunks / Summaries</button>
        <button class="inspector-tab" id="tab-retrieval" role="tab"
                aria-controls="view-retrieval" aria-selected="false" tabindex="-1"
                data-view="retrieval" data-step="retrieval">Retrieval</button>
        <button class="inspector-tab" id="tab-generation" role="tab"
                aria-controls="view-generation" aria-selected="false" tabindex="-1"
                data-view="generation" data-step="generation">Generation</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="view-groundtruth" class="inspector-view" role="tabpanel" aria-labelledby="tab-groundtruth" tabindex="0"></section>

    <section id="view-chunks" class="inspector-view" role="tabpanel" aria-labelledby="tab-chunks" tabindex="0" hidden>
      <div class="inspector-active-config" id="chunks-active-config"></div>
      <div class="inspector-controls">
        <button id="build-chunks">Build index &amp; list chunks</button>
        <span id="chunks-status" aria-live="polite" aria-atomic="true"></span>
      </div>
      <!-- Two kinds of row, one index. The leaves are what the chunker cut; the
           summaries are what a grouping wrote *beside* them, and both are in the
           collection retrieval searches. The toggle exists because they were
           previously one list that silently held only the first kind. -->
      <div class="mode-toggle" id="chunks-mode" role="group"
           aria-label="which rows to list">
        <button id="chunks-mode-chunks" data-mode="chunks"
                aria-pressed="true">Chunks</button>
        <button id="chunks-mode-summaries" data-mode="summaries"
                aria-pressed="false">Summaries</button>
      </div>
      <div id="chunks-body"></div>
      <div id="summaries-body" hidden></div>
    </section>

    <section id="view-retrieval" class="inspector-view" role="tabpanel" aria-labelledby="tab-retrieval" tabindex="0" hidden>
      <div class="inspector-active-config" id="retrieval-active-config"></div>
      <!-- Add a question the experiment did not select, and it is retrieved,
           answered and scored under the same config as the ones on screen. The
           old control here was a bare <select> labelled "Question" beside a
           "Run retrieval" button, which said nothing about what picking one
           would do or where the result would appear. -->
      <div class="inspector-controls">
        <button id="add-question" aria-expanded="false"
                aria-controls="question-picker">Add a question</button>
        <span id="retrieval-status" aria-live="polite" aria-atomic="true"></span>
      </div>
      <div class="question-picker" id="question-picker" hidden>
        <input type="search" id="question-picker-filter" class="q-filter"
               placeholder="filter by id, or by words in the question"
               aria-label="Filter questions">
        <div class="q-legend">
          <span class="q-chip q-chip--hard">hard</span>
          <span class="q-chip q-chip--medium">medium</span>
          <span class="q-chip q-chip--easy">easy</span>
          <span class="q-legend-note">hover a question to read it with its
            evidence and expected answer</span>
        </div>
        <div id="question-picker-list" role="listbox"
             aria-label="Ground-truth questions" tabindex="-1"></div>
      </div>
      <!-- One table per question of the experiment the lab last ran, and only
           those questions. Every table is a clone of the template below, so the
           columns are written once. It carries its own config line: the set and
           the single ad-hoc question below can come from different runs, and one
           line describing two pipelines would be a lie. -->
      <div class="inspector-active-config" id="retrieval-set-config"></div>
      <div id="retrieval-questions"></div>
      <!-- Questions you added, kept in their own list. Identical rows and
           identical metrics, but not folded in among the selected ones: their
           scores were never part of the run's averages, and a view that hid
           that would be claiming a sample the experiment did not measure. -->
      <div id="retrieval-added" class="added-block"></div>
      <!-- The single-question table, for the manual "Run retrieval" above. -->
      <div id="retrieval-body"></div>
      <div class="inspector-answer" id="retrieval-answer" data-step="generation"></div>

      <template id="retrieval-table-template">
        <table class="retrieval-table">
          <thead>
            <tr>
              <th>chunk</th>
              <!-- The path column is the three ranks drawn as a shape; the same
                   three numbers follow it, so nothing lives only in the picture. -->
              <!-- Not sortable: it is the same three ranks as a shape, and the
                   three columns after it hold the numbers to sort on. -->
              <th data-step="retrieval" data-nosort>path</th>
              <!-- A rank is best at 1, so these three open ascending. Left to
                   the generic "highest first" rule, clicking dense led with the
                   candidate dense liked least. -->
              <th data-step="retrieval" data-order="ascending">dense</th>
              <th data-step="retrieval" data-order="ascending">bm25</th>
              <th data-step="retrieval" data-order="ascending">RRF</th>
              <th data-step="retrieval">rerank</th>
              <th data-step="generation">grade</th>
              <th>kept</th>
              <th>gold</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </template>
    </section>

    <!-- Generation: everything the retrieval tab shows, plus the answer the
         fixture says is right, the answer the experiment actually wrote, and
         the scores for it — each score with the '!' that explains it. Only an
         evaluation generates, so this view follows the last one of those. -->
    <section id="view-generation" class="inspector-view" role="tabpanel" aria-labelledby="tab-generation" tabindex="0" hidden>
      <div class="inspector-active-config" id="generation-active-config"></div>
      <div id="generation-ragas"></div>
      <div id="generation-questions"></div>
      <div id="generation-added" class="added-block"></div>
    </section>
  </main>
  <!-- The column sorter, the one file this page shares with the panel on :9002:
       clicking a header has to mean the same thing on both. Before inspector.js,
       which calls into it as it builds each table. -->
  <script src="/sorttable.js"></script>
  <!-- Shared utilities, before inspector.js, which calls into it. -->
  <script src="/lab.js"></script>
  <script src="/inspector/inspector.js"></script>
</body>
</html>
