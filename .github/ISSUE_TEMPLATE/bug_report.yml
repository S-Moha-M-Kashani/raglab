name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Two things before you type:

        **Never paste a model key.** An issue is public. An OpenRouter key typed
        into the panel is held in process memory and never written anywhere —
        please keep it out of here too.

        **Anything security-related goes to email instead** —
        s.moha.m.kashani@gmail.com. See [`SECURITY.md`](../blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. `uv run --extra local-embeddings raglab`
        2. Open http://127.0.0.1:9002/
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version in `pyproject.toml`, or the commit you are on.
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part
      options:
        - The panel (/)
        - The Inspector (/inspector)
        - The leaderboard (/leaderboard)
        - The Ask widget
        - The terminal commands (sweep, judgescreen, leaderboard)
        - Setup, Docker or the tests
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Your setup
      description: >
        Operating system, `python --version`, and how you are running it —
        native or Docker. For anything that reached a model, the values of
        `RAGLAB_LLM` and `RAGLAB_MODEL`, never the key itself.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Anything the terminal or the browser console said
      description: Pasted here as text. Check it for keys first.
      render: shell
