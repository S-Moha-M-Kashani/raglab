# The widget's knowledge base: the facts search_knowledge_base serves and
# the CLI system prompt inlines. One key per topic; model-facing text, so a
# fixture like every other prompt page — a stale fact is a YAML edit, not a
# code change. Keys and text are both keyword-matched, so a topic's wording
# doubles as its retrieval surface.
purpose: >-
  The RAG lab is a measurement-driven retrieval workbench: chunking and
  retrieval choices for any use case are decided by evaluation against a
  ground-truth corpus, never by taste. The corpus is itself a config field
  (IndexConfig.dataset), so the same pipeline is measured against any
  corpus/ground-truth pair that satisfies the import contract. The bundled
  default is diary-en, a synthetic one-year English diary of 167 sessions,
  translated from the Farsi original diary-fa which ships beside it — the
  first case study, not the project's identity; six further control
  corpora test whether a finding generalises. An empty dataset field in an
  old config still means diary-fa, so recorded fingerprints keep their
  meaning.
surfaces: >-
  The lab serves everything from one origin on port 9002
  (uv run --extra local-embeddings raglab) and opens no other ports: the
  experiment panel at /, the read-only Inspector at /inspector, and the
  leaderboard at /leaderboard.
  A fourth page, the developer's step-by-step trace of a widget thread at
  /dev/trace, exists only when RAGLAB_DEV_KEY is set and is a 404
  otherwise; the key is typed on the page, never carried in the URL.
architecture: >-
  The lab prescribes no single RAG architecture: every stage is a config
  knob, and the right pipeline depends on the use case — measurement
  decides. The measured pipeline has three steps: indexing (split plan,
  embedder, optional summary hierarchy, all into the in-memory vector
  store), retrieval (query understanding, retrieve, fuse, rerank, grade)
  and generation. Around it sits an evaluation harness that scores what
  the stages produced and records every run, and a frontend that serves
  the panel, the Inspector and the leaderboard. The widget is a helper
  riding all three surfaces, deliberately outside the measured pipeline.
metrics: >-
  Exactly four judged metrics decide between architectures: faithfulness,
  answer relevancy, LLM context precision and context recall. The decision
  score is their unweighted mean, undefined unless all four are present,
  and it is never shown without its spread — the standard error of the
  per-question composites, computed per question first because the four
  metrics score the same answers and move together. Every other metric is
  reported for context and does not vote.
methodology: >-
  A sweep (raglab-sweep) changes exactly one knob per candidate and holds
  every model fixed, so any difference in score is attributable to that
  knob. The answering model and the judging model must be different — the
  configuration refuses the pairing — and a judge must pass a screening
  gate (raglab-judgescreen) before it may grade. Both sweep entry points
  refuse the fake backend: a ranking built on invented scores would be
  worthless.
comparability: >-
  A ranking groups before it ranks. Rows are partitioned into
  comparability groups — one per (dataset, question set, judge) — and only
  inside one group may a winner be named, and even then the verdict
  refuses when the lead is inside the combined error of the two runs. The
  leaderboard is a different object: one sortable table per dataset,
  holding every experiment that touched that corpus, with judge and
  question set as columns to compare on. The board names no winner,
  because rows graded by different judges over different question sets
  share it.
integrity: >-
  A row must never lie about what produced it. A model the active backend
  does not serve is a refusal, never a silent substitution; a judging
  stage that cannot reach its model refuses to score rather than returning
  a passing default; an unparsable verdict is read in the direction that
  costs more work; a degraded answer carries its reason on the row. The
  same rule holds on the knob surface: opening a recorded experiment never
  writes an unavailable option into a control — the knob stays where it
  was and the mismatch is named.
storage: >-
  There is no vector database: the index lives in process memory
  (MemoryVectors, brute-force cosine) and is discarded when the process
  ends, so every build is honest about being reproducible from config. The
  durable artifacts are one JSON file per evaluation in .runs/, one ledger
  row per job in databases/raglab.db, the widget's conversations in
  databases/widget.db — a log of what was said, with no metric, run or
  ledger row in it, that no board or ranking ever reads — and
  databases/corpora.db, the exact corpus every archived experiment ran on,
  one row per distinct content version, fetched by id and verified against
  its recorded fingerprint before it is served.
archives: >-
  An experiment that finishes archives itself into the ledger, written by
  the same codec the export button uses — only for a job that actually
  finished; a cancelled or errored one is never archived. An imported
  archive is preserved verbatim, evidence included, as an insert-only
  ledger row with no job and no run file behind it: it appears on the
  board under its dataset but earns no ranking claim.
reproducibility: >-
  IndexConfig.fingerprint() is a promise about a rebuild: two configs with
  the same fingerprint build the same index. Default values are dropped
  from the payload so old collection names stay reproducible, knobs no
  build reads cost no rebuild, and retrieval knobs stay outside the
  fingerprint so they sweep freely against one build. Dataset identity is
  the id, never a file path.
datasets: >-
  Seven corpora ship in fixtures/corpus_groundtruth_datasets/, each an
  ordinary <name>_corpus.json / <name>_groundtruth.json pair — the
  built-in diary included, with no special-cased loader. All seven satisfy
  the same contract that validates a user-supplied import, and imported
  datasets land in .datasets/. For quick work the smoke corpus
  (smoke-mini) builds in seconds; the 167-session diary is for claims
  about the diary itself.
commands: >-
  Entry points: raglab (panel, Inspector and leaderboard on one port,
  9002), raglab-lab (the same server with a preflight test pass),
  raglab-sweep (one-knob-at-a-time candidate ranking), raglab-judgescreen
  (screens a model before it may judge), and raglab-leaderboard (the board
  as a CLI reading).
embedder: >-
  The default embedder is heydariAI/persian-embeddings over
  sentence-transformers (the local-embeddings extra) — Persian-tuned but
  bilingual (Farsi + English), kept from the original Farsi diary case
  study — and a different corpus wants an encoder verified on its own
  language. The ascii-hash embedder is kept as a reference point: it
  embeds Farsi to the zero vector and scores ~0.01 recall on diary-fa
  against 0.617 for the real encoder — a built-in demonstration of why the
  encoder must fit the corpus.
widget: >-
  The widget is the lab's conversational helper, present on every surface
  from one shared widget.js. It sits outside the measured LLM seam — it
  writes no run, no ledger row, no number that could vote in a ranking —
  which is exactly what allows it to trace to LangSmith. Each reply may
  carry a token account, and that account is a bill, not a measurement: it
  decides nothing. CLI backends (claude/codex) run without an API key but
  cannot run tools; New Chat deletes the thread it is in and no other.
